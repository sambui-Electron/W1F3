# yaml-language-server: $schema=https://raw.githubusercontent.com/sambui-Electron/W1F3/main/config.schema.json
# Ported from the supplied Fastfetch JSONC configuration.
# W1F3-specific animation settings retain their application defaults.

logo:
  type: file
  source: "C:/Users/PC/.config/fastfetch/ascii.txt"
  color:
    "1": "#CDD6F4"
    "2": "#F2CDCD"
    "3": "#F5C2E7"
    "4": "#F5E0DC"
    "5": "#F9E2AF"
    "6": "#A6E3A1"
    "7": "#94DCEB"
    "8": "#89DCEB"
    "9": "#74C7EC"
  padding:
    top: 1
    right: 3

display:
  separator: " "

modules:
  - break

  - type: custom
    format: "\u001b[90m┌──────────────────────Hardware──────────────────────┐"

  - type: host
    key: "󰌢  PC"
    keyColor: green

  - type: cpu
    key: "│ ├󰻠 "
    keyColor: green

  - type: gpu
    key: "│ ├󰍹 "
    keyColor: green

  - type: memory
    key: "│ ├󰑭 "
    keyColor: green

  - type: disk
    key: "└ └󰋊 "
    keyColor: green

  - type: custom
    format: "\u001b[90m└────────────────────────────────────────────────────┘"

  - break

  - type: custom
    format: "\u001b[90m┌──────────────────────Software──────────────────────┐"

  - type: os
    key: "󰄛  OS"
    keyColor: yellow

  - type: kernel
    key: "│ ├ "
    keyColor: yellow

  - type: bios
    key: "│ ├󰖡 "
    keyColor: yellow

  - type: packages
    key: "│ ├󰏗 "
    keyColor: yellow

  - type: shell
    key: "└ └󰞷 "
    keyColor: yellow

  - break

  - type: de
    key: "󰧨  DE"
    keyColor: blue

  - type: lm
    key: "│ ├󰍁 "
    keyColor: blue

  - type: wm
    key: "│ ├󱂬 "
    keyColor: blue

  - type: wmtheme
    key: "│ ├󰉦 "
    keyColor: blue

  - type: terminal
    key: "└ └󰆍 "
    keyColor: blue

  - type: custom
    format: "\u001b[90m└────────────────────────────────────────────────────┘"

  - break

  - type: custom
    format: "\u001b[90m┌────────────────────Uptime / Age / DT───────────────┐"

  - type: command
    key: "  ›  OS Age  "
    keyColor: magenta
    shell: powershell
    text: "$installDate = (Get-CimInstance Win32_OperatingSystem).InstallDate; [math]::Floor(((Get-Date) - $installDate).TotalDays).ToString() + ' days'"

  - type: uptime
    key: "  ›  Uptime  "
    keyColor: magenta

  - type: datetime
    key: "  ›  DateTime  "
    keyColor: magenta

  - type: custom
    format: "\u001b[90m└────────────────────────────────────────────────────┘"

  - type: colors
    paddingLeft: 18
    symbol: circle
