# yaml-language-server: $schema=https://raw.githubusercontent.com/sambui-Electron/W1F3/main/config.schema.json
# W1F3 configuration
# Native W1F3 settings translated from the supplied Fastfetch profile.
# Stored at %USERPROFILE%\.config\fetch\config.yaml.

# W1F3 logo source. The renderer reads this file directly.
logo: "Windows 11"
logo_file: "C:/Users/PC/.config/fastfetch/ascii.txt"

# Map the source logo's $1-$9 markers to W1F3's ANSI true-colour palette.
logo_palette:
  "1": "#CDD6F4"
  "2": "#F2CDCD"
  "3": "#F5C2E7"
  "4": "#F5E0DC"
  "5": "#F9E2AF"
  "6": "#A6E3A1"
  "7": "#94E2D5"
  "8": "#89DCEB"
  "9": "#74C7EC"

# Space around the rendered logo. Right padding is applied between logo and info.
logo_padding:
  top: 1
  right: 3

# Spacing between information labels and values.
separator: " "

# Renderer settings retained from your W1F3 defaults.
refresh: 1.0
speed: 0.45
size: 1.0
depth: 1.0
spin: "xy"
height: 32
adaptive_scale: true
adaptive_strength: 0.65
adaptive_min: 1.0
adaptive_max: 1.5
mouse: true

color: true
show_info: true
box: false

# W1F3 information layout. Items are rendered in this exact order.
# 'section' is plain section text, 'field' displays a system value,
# 'blank' inserts vertical space, and 'palette' draws the terminal swatches.
layout:
  - type: blank
  - type: section
    text: "┌──────────────────────Hardware──────────────────────┐"
    color: gray
  - type: field
    field: host
    label: "󰌢  PC"
    color: green
  - type: field
    field: cpu
    label: "│ ├󰻠 "
    color: green
  - type: field
    field: gpu
    label: "│ ├󰍹 "
    color: green
  - type: field
    field: memory
    label: "│ ├󰑭 "
    color: green
  - type: field
    field: disk
    label: "└ └󰋊 "
    color: green
  - type: section
    text: "└────────────────────────────────────────────────────┘"
    color: gray
  - type: blank

  - type: section
    text: "┌──────────────────────Software──────────────────────┐"
    color: gray
  - type: field
    field: os
    label: "󰄛  OS"
    color: yellow
  - type: field
    field: kernel
    label: "│ ├ "
    color: yellow
  - type: field
    field: bios
    label: "│ ├󰖡 "
    color: yellow
  - type: field
    field: packages
    label: "│ ├󰏗 "
    color: yellow
  - type: field
    field: shell
    label: "└ └󰞷 "
    color: yellow
  - type: blank

  - type: field
    field: de
    label: "󰧨  DE"
    color: blue
  - type: field
    field: lm
    label: "│ ├󰍁 "
    color: blue
  - type: field
    field: wm
    label: "│ ├󱂬 "
    color: blue
  - type: field
    field: wmtheme
    label: "│ ├󰉦 "
    color: blue
  - type: field
    field: terminal
    label: "└ └󰆍 "
    color: blue
  - type: section
    text: "└────────────────────────────────────────────────────┘"
    color: gray
  - type: blank

  - type: section
    text: "┌────────────────────Uptime / Age / DT───────────────┐"
    color: gray
  - type: field
    field: os_age
    label: "  ›  OS Age  "
    color: magenta
  - type: field
    field: uptime
    label: "  ›  Uptime  "
    color: magenta
  - type: field
    field: datetime
    label: "  ›  DateTime  "
    color: magenta
  - type: section
    text: "└────────────────────────────────────────────────────┘"
    color: gray
  - type: palette
    padding_left: 18
    symbol: circle
