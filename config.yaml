# yaml-language-server: $schema=https://raw.githubusercontent.com/sambui-Electron/W1F3/feature/fastfetch-style-yaml/config.schema.json
# W1F3 configuration - structured YAML, not JSON/JSONC.

logo:
  type: file
  source: "C:/Users/PC/.config/fastfetch/ascii.txt"
  color:
    "1": "#CDD6F4"
    "2": "#F2CDCD"
    "3": "#F5C2E7"
    "4": "#F5E0DC"
    "5": "#F9E2AF"
    "6": "#A6E3A1"
    "7": "#94E2D5"
    "8": "#89DCEB"
    "9": "#74C7EC"
  padding:
    top: 1
    right: 3

display:
  separator: " "

renderer:
  refresh: 1.0
  speed: 0.45
  size: 1.0
  depth: 1.0
  spin: xy
  height: 32
  adaptive_scale: true
  adaptive_strength: 0.65
  adaptive_min: 1.0
  adaptive_max: 1.5
  mouse: true

color: true
show_info: true
box: false

modules:
  - type: break
  - type: custom
    format: "┌──────────────────────Hardware──────────────────────┐"
  - type: host
    key: "󰌢  PC"
    key_color: green
  - type: cpu
    key: "│ ├󰻠 "
    key_color: green
  - type: gpu
    key: "│ ├󰍹 "
    key_color: green
  - type: memory
    key: "│ ├󰑭 "
    key_color: green
  - type: disk
    key: "└ └󰋊 "
    key_color: green
  - type: custom
    format: "└────────────────────────────────────────────────────┘"
  - type: break

  - type: custom
    format: "┌──────────────────────Software──────────────────────┐"
  - type: os
    key: "󰄛  OS"
    key_color: yellow
  - type: kernel
    key: "│ ├ "
    key_color: yellow
  - type: bios
    key: "│ ├󰖡 "
    key_color: yellow
  - type: packages
    key: "│ ├󰏗 "
    key_color: yellow
  - type: shell
    key: "└ └󰞷 "
    key_color: yellow
  - type: break

  - type: de
    key: "󰧨  DE"
    key_color: blue
  - type: lm
    key: "│ ├󰍁 "
    key_color: blue
  - type: wm
    key: "│ ├󱂬 "
    key_color: blue
  - type: wmtheme
    key: "│ ├󰉦 "
    key_color: blue
  - type: terminal
    key: "└ └󰆍 "
    key_color: blue
  - type: custom
    format: "└────────────────────────────────────────────────────┘"
  - type: break

  - type: custom
    format: "┌────────────────────Uptime / Age / DT───────────────┐"
  - type: os_age
    key: "  ›  OS Age  "
    key_color: magenta
  - type: uptime
    key: "  ›  Uptime  "
    key_color: magenta
  - type: datetime
    key: "  ›  DateTime  "
    key_color: magenta
  - type: custom
    format: "└────────────────────────────────────────────────────┘"
  - type: colors
    padding_left: 18
    symbol: circle
