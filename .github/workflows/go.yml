name: Go CI

on:
  push:
    branches: ["main", "feature/native-fastfetch-yaml-restart"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: go build -trimpath -o w1f3.exe .
